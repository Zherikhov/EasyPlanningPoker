spring.config.import = optional:application.secure.properties

spring.application.name=easy_planning_poker

spring.datasource.url=${psql.url}
spring.datasource.username=${psql.username}
spring.datasource.password=${psql.password}

server.port=8080
server.address=0.0.0.0

spring.jpa.hibernate.ddl-auto=update

# Logging configuration
logging.file.path=logs
logging.level.root=info

# HTTP Request Logging
spring.mvc.log-request-details=true
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# DB Logging (SQL/Parameters) - can be enabled by profile or temporarily
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.com.baeldung=trace

logging.level.org.apache.coyote.http11=ERROR
logging.level.org.apache.tomcat.util.net=ERROR

# Disable whitelabel HTML error page to avoid HTML on /api/** and committed responses
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never

# Dev JWT secret (override in env/secure props)
jwt.secret=${jwtsecret}

spring.security.oauth2.client.registration.google.client-id=${google.client-id}
spring.security.oauth2.client.registration.google.client-secret=${google.client-secret}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.behind-proxy-enabled=${APP_BEHIND_PROXY_ENABLED:false}